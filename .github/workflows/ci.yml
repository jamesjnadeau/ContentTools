name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The golden master compares against the frozen v1.6.16 artifact,
          # and the provenance check needs tags.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint (no bare document/window outside the RootContext seam)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Size budgets
        # Right after the build, so a page-weight regression fails in
        # seconds rather than after the browser suites.
        run: npm run test:size

      - name: Install browsers
        # Three engines, because ShadowRootContext.getRange() is a
        # feature-detected chain and each of them takes a different branch.
        # Only element-golden.spec.mjs runs on all three; everything else is
        # Chromium-only, either because it compares snapshots (which are not
        # portable between engines) or because it tests the build rather than
        # the browser.
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Suites + coverage floor (real browser)
        run: npm run test:coverage

      - name: Golden master (against the frozen legacy bundle)
        run: npx playwright test --config test/golden/playwright.config.mjs golden.spec.mjs
        env:
          CHROMIUM_PATH: ''

      - name: Golden master (against the current build)
        run: npx playwright test --config test/golden/playwright.config.mjs golden.spec.mjs
        env:
          CT_BUNDLE: /dist/content-tools.js
          CHROMIUM_PATH: ''

      - name: Stylesheet split is an exact partition
        run: npm run test:styles
        env:
          CHROMIUM_PATH: ''

      - name: Custom element against the BUILT dist/element.js
        run: npm run test:element:dist
        env:
          CHROMIUM_PATH: ''

      - name: Element equivalence, on chromium + firefox + webkit
        run: npm run test:element:golden

      - name: Markdown mode against the BUILT dist/markdown.js
        run: npm run test:markdown:dist
        env:
          CHROMIUM_PATH: ''

      - name: The CMS half against the BUILT dist/cms.js
        run: npm run test:cms:dist
        env:
          CHROMIUM_PATH: ''

      - name: Visual regression (rebuilt CSS vs legacy stylesheet)
        run: npx playwright test --config test/golden/playwright.config.mjs visual.spec.mjs
        env:
          CT_CSS: /dist/content-tools.css
          CHROMIUM_PATH: ''

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  provenance:
    # Proves the vendored libraries still reproduce from upstream CoffeeScript,
    # which is what justified absorbing them as source. Cheap, and it keeps
    # vendor-src/UPSTREAM.md honest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./vendor-src/verify-provenance.sh
