# The runtime config THIS deployment is given, for the one site it edits.
#
# Point `backend.repo` at your own repository and describe your own
# collections; nothing else about the install changes. One build, many
# deployments, one of these files each.
#
# YAML rather than JSON on purpose: it is the form an operator actually
# hand-edits, and it is the branch of `loadConfig` that pulls in the
# parser, so the shipped page exercises the lazy import too.
backend:
  # A placeholder, and one that fails LOUDLY rather than quietly: a real
  # fine-grained token offered against `owner/site` is refused at the
  # sign-in gate, because the gate checks the token against this
  # repository before letting anything through. Change it to your own
  # before deploying; the test suite serves this one from an in-memory
  # GitHub, which is why it can stay here.
  repo: owner/site
  branch: main

# Where this deployment's content is PUBLISHED, which is where it is
# EDITED: `/admin` manages drafts and pull requests, and the words of an
# entry are changed on the site's own page with the real template around
# them. Leave `site` out entirely and the admin screens still work -- they
# simply offer no link to a page, and say so rather than showing a button
# that goes nowhere.
site:
  # `base` is OMITTED here, which is how a site served at the root is
  # spelled -- a `base:` with nothing after it means the same. Writing
  # it out as `base: ''` is refused, for the reason every other optional
  # string here is: a blank value is how a deleted one looks. Held apart
  # from each collection's `page` because one build can be served at two
  # prefixes, so a site under one would say:
  #   base: /my-project
  # A pull request's deploy preview, which is what makes an unpublished
  # entry editable at all: a new post and a post under review are both
  # absent from the live site, and the preview renders the branch the
  # editor would be committing to. Netlify's spelling; Cloudflare Pages
  # and Vercel have their own. Leave it out and the admin screen warns
  # rather than linking a draft to its published page.
  preview: https://deploy-preview-{{pr}}--example.netlify.app

media:
  folder: static/images
  publicPath: /images

collections:
  - name: blog
    label: Blog
    folder: content/blog
    # Both off by default, and named here because this file is the
    # example a deployment copies. `delete` is separate from `create` on
    # purpose: letting authors add posts is not the same permission as
    # letting them take pages down.
    create: true
    delete: true
    # Where a post of this collection is published, and which element on
    # that page holds its body. `page` is what the Edit link is built
    # from; `body` is what the in-page editor edits, and a page whose own
    # markup carries `data-cms-body` overrides it.
    page: /blog/{{slug}}/
    body: article .content
    fields:
      - {name: title, widget: string}
      - {name: date, widget: datetime}
  - name: pages
    label: Pages
    # On the collection, because every file in it is rendered by the same
    # template. Each file names its own `page`, since a fixed set of
    # entries has nothing for a template to vary over.
    body: article .content
    files:
      - {name: about, label: About, file: content/about.md, page: /about/}
