<!DOCTYPE html>
<!--
  The deployable CMS.

  This is the whole application: one tag, one config file. Copy `app/` and
  `dist/` to a static host, point `config` at the file describing the one
  repository that deployment edits, and that is the install.

  It is ALSO the page test/golden/shell-dist.spec.mjs drives against the
  built dist/shell.js, which is deliberate: the playground taught this repo
  that a page nobody runs is a page that has quietly stopped working, and
  one page that is both the deliverable and the fixture cannot drift from
  itself.

  There is NO content stylesheet link here, and there was one until M6-3.
  Its rules -- drop indicators, hover outlines, drag cursors -- exist for
  editable content sitting in the document, and there is none on this page
  any more: /admin manages drafts and pull requests, and the words of an
  entry are written on the site's own page. The surface that DOES put an
  editor over content injects the sheet itself (see `src/edit/index.ts`),
  which is the only arrangement that works there anyway -- a page this
  deployment does not own cannot be asked to carry a <link>.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content</title>
<style>
    /* The page's only job is to give the shell the viewport. Everything
       else it draws is inside its own shadow root. */
    html, body { height: 100%; }
    body { margin: 0; }
    content-tools-cms { height: 100%; }
</style>
<script type="module" src="../dist/shell.js"></script>
</head>
<body>
<content-tools-cms config="./cms-config.yml"></content-tools-cms>
</body>
</html>
