<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blog &mdash; Example</title>

<!-- Where this deployment's config lives. Without it the script looks in
     `/cms-config.yml`, which is right for a site served at the root and
     wrong for this one. -->
<meta name="cms:config" content="/playground/site-config.yml">

<style>
    body { font: 16px/1.5 Georgia, serif; margin: 0; color: #222; }
    header, footer { background: #f3f3f3; padding: 12px 24px; }
    nav a { margin-right: 12px; }
    .layout { max-width: 40em; margin: 0 auto; padding: 24px; }
    .post h2 { font-size: 1.1em; }
</style>
</head>
<body>

<header>
    <strong>Example</strong>
    <nav><a href="./index.html">Home</a><a href="./cms.html">Admin</a></nav>
</header>

<div class="layout">
    <!-- The site's own listing. It is not an entry, so nothing here is
         the editor's to touch. -->
    <h1>Blog</h1>

    <!-- `starter: /playground/blog.html` in site-config.yml. Open this page
         with `?cms-edit`, signed in, and the bar offers `New Blog entry`,
         a plain link to the collection's `newPage`. -->
    <ul class="posts">
        <li><a href="./first-post.html">A first post</a></li>
    </ul>
</div>

<footer>
    <p>The page a site lists its posts on. It writes nothing itself: it
    only points at the page where a new one is named and written.</p>
</footer>

<!-- The one line a site adds. It goes on EVERY page, so what it costs a
     reader is the whole argument for its shape. -->
<script type="module" src="../dist/edit.js"></script>

</body>
</html>
